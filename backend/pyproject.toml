[project]
name = "brf-backend"
version = "0.1.0"
description = "Grounded Swedish BRF document Q&A backend (vertical slice)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call a real LLM provider (skipped unless RUN_LLM_TESTS=1)",
    "ocr: tests that need a local tesseract binary",
]
